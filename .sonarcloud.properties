# SonarCloud configuration for this repository.
#
# THE FILENAME IS LOAD-BEARING. Analysis runs via the SonarCloud GitHub App
# (automatic analysis), which reads `.sonarcloud.properties`. It does NOT read
# `sonar-project.properties` -- that file is for scanner-CLI runs, which this
# estate does not do, so settings placed there are silently ignored and the
# analysis proceeds as though the file were absent.
#
# .github/workflows/sonarqube-hdf-emit.yml only fetches the results afterwards
# and converts them to OHDF; it does not configure the analysis.
#
# ---- Deliberately empty of exclusions ---------------------------------------
#
# The sibling profile repositories carry a `sonar.cpd.exclusions` entry for
# their one-control-per-file layout. Nothing here has that shape: this is a
# generator plus YAML catalogs, and duplication in it would be a real finding.
#
# `tests/trufflehog-fixture/` holds a synthetic AWS key on purpose (it proves
# the secret scanner still fires) and Sonar is expected to raise a hotspot on
# it. That hotspot is NOT excluded here. Excluding it would be a suppression,
# and per docs/dev/issue_rules.md a suppression is a risk-acceptance decision
# that belongs to the owner, recorded with its reason -- not something added
# pre-emptively by whoever set the file up.
