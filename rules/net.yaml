# Rule catalog — Network & Boundary Protection (NET). Portable: no organization
# values, no organization control names.
#
# ---------------------------------------------------------------------------
# THE CAVEAT THAT GOVERNS THIS WHOLE DOMAIN
# ---------------------------------------------------------------------------
# AWS Config evaluates security groups, NACLs and load balancers as OBJECTS, not
# as reachability. An unused security group with 0.0.0.0/0 fails, while a
# genuinely exposed workload sitting behind a compliant security group and an
# open ALB passes.
#
# This domain therefore has the widest gap in the programme between "the rule
# says PASS" and "the boundary is sound". Every rule here carries that in its
# rendered description, because an operator reading a green Config console is
# exactly the person who needs to know it.
#
# ---------------------------------------------------------------------------
# IPv6
# ---------------------------------------------------------------------------
# Several of these rules historically evaluated only 0.0.0.0/0 and not ::/0.
# `ipv6_evaluated` records what we believe per rule, and `false` is rendered into
# the description as a caveat. Where it is unknown it is marked unknown rather
# than assumed -- an assumed `true` here is a silent IPv6 hole.

version: 1
domain: NET
pack_slug: 800-53r5-NET

# Regional, unlike IAM: these resource types are recorded per Region, so the pack
# is deployed to every Region carrying workloads.
region_scope: regional

# Rendered into the coverage report. The gap this names is the single most
# important thing a reader of this pack's results needs to hold in mind.
domain_caveat: >-
  AWS Config evaluates security groups, NACLs and load balancers as OBJECTS, not
  as reachability. An unused security group with 0.0.0.0/0 fails, while a
  genuinely exposed workload behind a compliant security group and an open load
  balancer passes. This pack's verdicts are configuration facts about boundary
  components, not an assertion that the boundary is sound. Reachability testing
  is a different evidence producer and this pack does not substitute for it.

# Indicators in scope for this domain that no Config rule here measures.
not_modeled:
  KSI-CNA-EIS: >-
    Enforcing Intended State is an architecture property — whether infrastructure
    is redeployed rather than modified in place. That is not a resource attribute
    Config can read. It belongs to the VCM pack's change-management evidence or to
    attestation; forcing a rule onto it would manufacture a verdict.
  KSI-CNA-RVP: >-
    Reviewing Protections covers denial-of-service posture (sc-5). Shield Advanced
    subscription state is not a Config resource, and WAF association rules cover
    only ALB, API Gateway and CloudFront. Model as hybrid with an attestation
    rather than claiming sc-5 from a WAF association.
  KSI-CNA-OFA: >-
    Optimizing for Availability is a design and capacity property, not a boundary
    configuration fact. Out of scope for this pack by intent.

required_resource_types:
  - AWS::EC2::SecurityGroup
  - AWS::EC2::NetworkAcl
  - AWS::EC2::Subnet
  - AWS::EC2::VPC
  - AWS::ElasticLoadBalancingV2::LoadBalancer

rules:

  restricted-common-ports:
    source: managed
    identifier: RESTRICTED_INCOMING_TRAFFIC
    description: >-
      Security groups do not allow unrestricted ingress on high-risk TCP ports.
    resource_types: [AWS::EC2::SecurityGroup]
    controls:
      nist_800_53_r5: [sc-7.5, sc-7]
      ksi: [KSI-CNA-RNT, KSI-CNA-ULN]
    coverage: partial
    ipv6_evaluated: false
    coverage_note: >-
      Evaluates the security group as an object, not reachability. An unused group
      fails while an exposed workload behind a compliant group and an open load
      balancer passes. The rule also exposes only FIVE port slots, so it can never
      express a longer prohibition list.
    parameters:
      "blockedPort{n}":
        odp: blocked_ingress_ports
        expand: 5

  vpc-sg-open-only-to-authorized-ports:
    source: managed
    identifier: VPC_SG_OPEN_ONLY_TO_AUTHORIZED_PORTS
    description: >-
      Security groups open to an untrusted source expose only authorized ports.
    resource_types: [AWS::EC2::SecurityGroup]
    controls:
      nist_800_53_r5: [sc-7.5, sc-7]
      ksi: [KSI-CNA-RNT]
    coverage: partial
    ipv6_evaluated: unknown
    coverage_note: >-
      The allow-list side of deny-by-default, and object-level like every rule in
      this pack. IPv6 handling is unverified for this rule; confirm against a live
      account before relying on it for a dual-stack boundary.
    parameters:
      authorizedTcpPorts: { odp: authorized_tcp_ports }

  vpc-default-security-group-closed:
    source: managed
    identifier: VPC_DEFAULT_SECURITY_GROUP_CLOSED
    description: >-
      The default security group of every VPC allows no inbound or outbound
      traffic.
    resource_types: [AWS::EC2::SecurityGroup]
    controls:
      nist_800_53_r5: [sc-7.5, sc-7]
      ksi: [KSI-CNA-RNT, KSI-CNA-MAT]
    coverage: full
    ipv6_evaluated: true

  internet-gateway-authorized-vpc-only:
    source: managed
    identifier: INTERNET_GATEWAY_AUTHORIZED_VPC_ONLY
    description: >-
      Internet gateways are attached only to VPCs authorized to have one.
    resource_types: [AWS::EC2::VPC]
    controls:
      nist_800_53_r5: [ac-4, sc-7]
      ksi: [KSI-CNA-ULN, KSI-IAM-ELP]
    coverage: partial
    ipv6_evaluated: true
    coverage_note: >-
      The authorized-VPC list defaults to EMPTY, which fails closed. That is
      deliberate -- a VPC id is environment-specific and any value shipped in a
      portable catalog would be somebody else's account. Populate it in your
      overlay before reading a FAIL here as a finding.
    parameters:
      AuthorizedVpcIds: { odp: authorized_igw_vpc_ids }

  subnet-auto-assign-public-ip-disabled:
    source: managed
    identifier: SUBNET_AUTO_ASSIGN_PUBLIC_IP_DISABLED
    description: >-
      Subnets do not automatically assign public IPv4 addresses.
    resource_types: [AWS::EC2::Subnet]
    controls:
      nist_800_53_r5: [sc-7, sc-7.5]
      ksi: [KSI-CNA-MAT, KSI-CNA-ULN]
    coverage: partial
    ipv6_evaluated: false
    coverage_note: >-
      Evaluates the IPv4 auto-assign attribute only. A subnet auto-assigning IPv6
      addresses passes this rule, which is the specific IPv6 gap this domain is
      prone to.

  vpc-flow-logs-enabled:
    source: managed
    identifier: VPC_FLOW_LOGS_ENABLED
    description: >-
      VPC flow logs are enabled.
    resource_types: [AWS::EC2::VPC]
    controls:
      nist_800_53_r5: [ac-4, sc-7]
      ksi: [KSI-CNA-ULN]
    coverage: supporting
    ipv6_evaluated: true
    coverage_note: >-
      Checks only that flow logging EXISTS -- not its destination, retention, or
      whether it captures rejected traffic. On its own this supports boundary
      monitoring rather than evidencing it; pair with the LOG pack's retention ODP
      or the evidence overstates AU coverage.

  elbv2-acm-certificate-required:
    source: managed
    identifier: ELBV2_ACM_CERTIFICATE_REQUIRED
    description: >-
      Application and network load balancers use ACM-managed certificates.
    resource_types: [AWS::ElasticLoadBalancingV2::LoadBalancer]
    controls:
      nist_800_53_r5: [sc-7]
      ksi: [KSI-CNA-ULN]
    coverage: supporting
    ipv6_evaluated: true
    coverage_note: >-
      Certificate provenance, not transport strength. It says nothing about the
      TLS policy or cipher suite in force -- that belongs to the CRYPTO pack's
      minimum-TLS ODP.

  alb-http-to-https-redirection-check:
    source: managed
    identifier: ALB_HTTP_TO_HTTPS_REDIRECTION_CHECK
    description: >-
      Application load balancer HTTP listeners redirect to HTTPS.
    resource_types: [AWS::ElasticLoadBalancingV2::LoadBalancer]
    controls:
      nist_800_53_r5: [ac-17, sc-7]
      ksi: [KSI-IAM-ELP]
    coverage: partial
    ipv6_evaluated: true
    coverage_note: >-
      Covers the redirect only. Traffic that never traverses the load balancer,
      and any listener on a non-standard port, is out of scope.
