name: Secret scan HDF emit (TruffleHog)

# Caller for the reusable secret-scan-hdf.yml published by the DevSecOps baseline.
#
# Companion to secret-scan.yml, which is the GATE. The gate answers "are there
# secrets" and stops; this converts the result to HDF so it joins the same
# evidence stream as SAST, SCA and the Config-rule evaluations.
#
# A clean scan still emits a one-control HDF recording the execution, so
# "we scanned it and it was clean" is something the evidence can say. See
# docs/ci-templates.md for why this is a caller rather than a copy.
#
# Never runs on pull_request: a fork PR would run this with write-ish intent,
# and the evidence stream should only reflect what landed on the default branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * 1'   # weekly, offset from the gate's daily run
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Fail fast rather than handing an empty boundary to the reusable, which would
  # label the evidence with nothing and file it at the wrong key.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required configuration
        env:
          BOUNDARY: ${{ vars.EVIDENCE_BOUNDARY }}
        run: |
          set -euo pipefail
          if [ -z "${BOUNDARY:-}" ]; then
            echo "::error::EVIDENCE_BOUNDARY is not set. Set it as a repository or organization variable; it labels the evidence and has no safe default."
            exit 1
          fi

  emit:
    needs: preflight
    uses: risk-sentinel/dev-sec-ops-baseline/.github/workflows/secret-scan-hdf.yml@949e54cbbf42fafe79903c4329c11e9146dae87d  # v0.4.0
    with:
      boundary: ${{ vars.EVIDENCE_BOUNDARY }}
    secrets:
      S3_EMIT_ROLE_ARN: ${{ secrets.AWS_CONFORMANCE_PACKS_EMIT_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      COMPLIANCE_S3_BUCKET: ${{ secrets.COMPLIANCE_S3_BUCKET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
