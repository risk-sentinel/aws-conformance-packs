# ODP catalog — Organization-Defined Parameters, portable across tenants.
#
# ONE GOVERNANCE DECISION LIVES IN ONE PLACE. This file declares what a knob IS:
# its type, its legal range, the OSCAL parameter it satisfies, and the baselines
# it applies to. It does NOT carry any organization's chosen value -- those live
# in an overlay, so the same catalog serves any tenant.
#
# The only value here is `default`, and a default is not a recommendation. It is
# what renders when an overlay is silent, and the traceability report records it
# as `assigned_by: catalog-default` precisely so it is never mistaken for a
# decision somebody made.
#
# ---------------------------------------------------------------------------
# WHY THE KEYS ARE OURS AND NOT OSCAL'S
# ---------------------------------------------------------------------------
# An AWS Config rule parameter is not 1:1 with an OSCAL ODP, and the mismatch is
# not an edge case -- it is the normal shape in IA and AC.
#
#   ia-05.01_odp.02 is ONE free-text ODP: "authenticator composition and
#   complexity rules are defined". Minimum password length, maximum password age
#   and reuse prevention are three AWS knobs that together EXPRESS that one ODP.
#
#   ia-05_odp.01 is "a time period for changing or refreshing authenticators by
#   authenticator type" -- one ODP whose own wording anticipates different values
#   per authenticator type. Access keys and Secrets Manager secrets are two such
#   types with two different periods.
#
# So the catalog is keyed by OUR name and JOINS to OSCAL. Several entries may
# share one `oscal_param_id`; that is expected and is not a duplicate. Keying
# this file on OSCAL ids directly cannot represent the relationship at all.
#
# ---------------------------------------------------------------------------
# TWO OSCAL ID FORMS, BOTH REQUIRED
# ---------------------------------------------------------------------------
# Rev 5 canonical ids are zero-padded with an `_odp.NN` suffix (ia-05.01_odp.02).
# The older `_prm_N` form (ia-5.1_prm_2) still exists, carried on each parameter
# as an `alt-identifier` prop -- and it is the form SPARC's ODP import fixture
# uses. Both are recorded so a value can be joined from either direction without
# a lookup table maintained somewhere else.
#
# ---------------------------------------------------------------------------
# BASELINE MEMBERSHIP IS LOAD-BEARING
# ---------------------------------------------------------------------------
# Controls differ across baselines: Low resolves 149 controls, Moderate 287,
# High 370. ac-2.3 is absent from Low entirely. An ODP bound to a control that
# is not in the target baseline must not render into that baseline's pack --
# it would measure something the baseline does not ask for and report it as
# coverage.
#
# Verified against the NIST SP 800-53 Rev 5 resolved baseline catalogs.

version: 1

odps:

  # ===========================================================================
  # ia-5.1 — Password-based Authentication
  # ---------------------------------------------------------------------------
  # All three below satisfy the SAME ODP (composition and complexity rules).
  # ===========================================================================

  password_minimum_length:
    description: >-
      Minimum number of characters an IAM console password must contain.
    control: ia-5.1
    oscal_param_id: ia-05.01_odp.02
    oscal_alt_id: ia-5.1_prm_2
    oscal_label: composition and complexity rules
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 6, max: 128 }
    default: 14
    # AWS refuses a value below 6 at the API, so a lower number is not a weak
    # policy -- it is a deploy-time error. The constraint catches it at build.

  password_maximum_age_days:
    description: >-
      Maximum age of an IAM console password before rotation is required.
    control: ia-5.1
    oscal_param_id: ia-05.01_odp.02
    oscal_alt_id: ia-5.1_prm_2
    oscal_label: composition and complexity rules
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 1095 }
    default: 90

  password_reuse_prevention:
    description: >-
      Number of previous passwords IAM remembers and refuses to accept again.
    control: ia-5.1
    oscal_param_id: ia-05.01_odp.02
    oscal_alt_id: ia-5.1_prm_2
    oscal_label: composition and complexity rules
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 24 }
    default: 24
    # 24 is the AWS maximum, not merely a strong choice. A larger value is
    # rejected by the API, which is why the constraint stops at it.

  # ===========================================================================
  # ia-5 — Authenticator Management
  # ---------------------------------------------------------------------------
  # Both below satisfy ia-05_odp.01, whose wording -- "by authenticator type" --
  # is what makes two different periods correct rather than contradictory.
  #
  # NOTE: issue #2 lists these under ia-5.1. That is a mis-binding: ia-5.1 is
  # specifically password composition, while authenticator refresh period is the
  # base control ia-5. Corrected here.
  # ===========================================================================

  access_key_maximum_age_days:
    description: >-
      Maximum age of an active IAM static access key before it must be rotated.
    control: ia-5
    oscal_param_id: ia-05_odp.01
    oscal_alt_id: ia-5_prm_1
    oscal_label: time period by authenticator type
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 365 }
    default: 90

  secret_rotation_period_days:
    description: >-
      Maximum interval between successful rotations of a Secrets Manager secret.
    control: ia-5
    oscal_param_id: ia-05_odp.01
    oscal_alt_id: ia-5_prm_1
    oscal_label: time period by authenticator type
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 365 }
    default: 90

  # ===========================================================================
  # ac-2.3 — Disable Accounts
  # ---------------------------------------------------------------------------
  # ac-02.03_odp.02 is "time period for account inactivity before disabling".
  # NOT IN THE LOW BASELINE -- ac-2.3 does not resolve there at all.
  # ===========================================================================

  credential_inactivity_days:
    description: >-
      Days an IAM credential may go unused before the account is disabled.
    control: ac-2.3
    oscal_param_id: ac-02.03_odp.02
    oscal_alt_id: ac-2.3_prm_2
    oscal_label: time period
    baselines: [moderate, high]
    type: integer
    constraint: { min: 1, max: 365 }
    default: 90

  secret_unused_days:
    description: >-
      Days a Secrets Manager secret may go unaccessed before it is flagged.
    control: ac-2.3
    oscal_param_id: ac-02.03_odp.02
    oscal_alt_id: ac-2.3_prm_2
    oscal_label: time period
    baselines: [moderate, high]
    type: integer
    constraint: { min: 1, max: 365 }
    default: 90

  # ===========================================================================
  # sc-7.5 — Deny by Default, Allow by Exception
  # ---------------------------------------------------------------------------
  # sc-07.05_odp.02 defines "systems for which network communications traffic is
  # denied by default and allowed by exception". In AWS terms the port lists ARE
  # that exception definition, which is why both bind here.
  #
  # NOT IN LOW: sc-7.5 resolves in Moderate and High only.
  # ===========================================================================

  blocked_ingress_ports:
    description: >-
      TCP ports that must not be reachable from an untrusted source in any
      security group.
    control: sc-7.5
    oscal_param_id: sc-07.05_odp.02
    oscal_alt_id: sc-7.5_prm_2
    oscal_label: systems
    baselines: [moderate, high]
    type: list
    item_type: integer
    # FIVE, and this is a hard AWS limit, not a style choice.
    # RESTRICTED_INCOMING_TRAFFIC exposes blockedPort1..blockedPort5 as five
    # discrete parameters. A sixth entry does not error at deploy time -- it is
    # simply never rendered, so the port stays unchecked while the catalog claims
    # it is blocked. Past five, the rule must move to a Guard policy.
    constraint: { max_items: 5, item_min: 1, item_max: 65535 }
    default: [20, 21, 3389, 3306, 4333]

  authorized_tcp_ports:
    description: >-
      TCP ports a security group is permitted to expose, as the allow-list side
      of deny-by-default.
    control: sc-7.5
    oscal_param_id: sc-07.05_odp.02
    oscal_alt_id: sc-7.5_prm_2
    oscal_label: systems
    baselines: [moderate, high]
    type: list
    item_type: integer
    # No AWS cap here: authorizedTcpPorts is one comma-separated string. The cap
    # is ours, to keep the rendered template inside the inline size budget.
    constraint: { max_items: 32, item_min: 1, item_max: 65535 }
    default: [443]

  # ===========================================================================
  # ac-4 — Information Flow Enforcement
  # ===========================================================================

  authorized_igw_vpc_ids:
    description: >-
      VPCs permitted to have an internet gateway attached. Empty means none are,
      which is the deny-by-default posture.
    control: ac-4
    oscal_param_id: ac-04_odp
    oscal_alt_id: ac-4_prm_1
    oscal_label: information flow control policies
    baselines: [moderate, high]
    type: list
    item_type: string
    # Deliberately defaults to EMPTY. A VPC id is environment-specific, and any
    # value shipped here would be someone else's account. An empty allow-list
    # fails closed, which is the right way for this to be wrong.
    constraint: { max_items: 50 }
    default: []

  # ===========================================================================
  # sc-7.4 — External Telecommunications Services
  # ===========================================================================

  traffic_flow_policy_review_days:
    description: >-
      Interval at which exceptions to the traffic flow policy are reviewed.
    control: sc-7.4
    oscal_param_id: sc-07.04_odp
    oscal_alt_id: sc-7.4_prm_1
    oscal_label: frequency
    baselines: [moderate, high]
    type: integer
    constraint: { min: 1, max: 365 }
    default: 365

  # ===========================================================================
  # ac-6.1 — Authorize Access to Security Functions
  # ---------------------------------------------------------------------------
  # ac-06.01_odp.05 is "security-relevant information for authorized access".
  # KMS actions over ciphertext are exactly that. Note ac-6 ITSELF carries no
  # OSCAL parameters at all -- the enhancement is where the ODP lives.
  # ===========================================================================

  blocked_kms_action_patterns:
    description: >-
      KMS action patterns that an IAM policy must not grant, as the deny-list side
      of least privilege for key usage.
    control: ac-6.1
    oscal_param_id: ac-06.01_odp.05
    oscal_alt_id: ac-6.1_prm_5
    oscal_label: security-relevant information
    baselines: [moderate, high]
    type: list
    item_type: string
    # Our cap, not an AWS one: the parameter is a single comma-separated string
    # and a long list bloats the template toward the inline size budget.
    constraint: { max_items: 24 }
    # kms:Decrypt and kms:ReEncryptFrom are the two that let a principal read
    # ciphertext outright, which is why they are the default deny.
    default: ["kms:Decrypt", "kms:ReEncryptFrom"]

  # ===========================================================================
  # sc-12 — Cryptographic Key Establishment and Management
  # ===========================================================================

  key_rotation_period_days:
    description: >-
      Maximum interval between automatic rotations of a symmetric customer-managed
      KMS key.
    control: sc-12
    oscal_param_id: sc-12_odp
    oscal_alt_id: sc-12_prm_1
    oscal_label: requirements
    baselines: [low, moderate, high]
    type: integer
    # AWS accepts 90-2560 days for RotationPeriodInDays.
    constraint: { min: 90, max: 2560 }
    default: 365
    # GUARD-BOUND. cmk-backing-key-rotation-enabled is boolean and sees only THAT
    # rotation is on, never how often. There is no managed-rule parameter for the
    # period anywhere, so this is substituted into policy text at generation time
    # and a change means regenerate + redeploy, not a stack parameter update.

  certificate_expiry_warning_days:
    description: >-
      How far ahead of expiry an ACM certificate is reported as non-compliant.
    control: sc-12
    oscal_param_id: sc-12_odp
    oscal_alt_id: sc-12_prm_1
    oscal_label: requirements
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 365 }
    default: 90

  # ===========================================================================
  # sc-8.1 — Transmission Confidentiality and Integrity | Cryptographic Protection
  # ===========================================================================

  approved_ssl_policies:
    description: >-
      ELB security policy names permitted on HTTPS and TLS listeners, as the
      minimum-TLS floor.
    control: sc-8.1
    oscal_param_id: sc-08.01_odp
    oscal_alt_id: sc-8.1_prm_1
    oscal_label: one-or-more
    baselines: [moderate, high]
    type: list
    item_type: string
    constraint: { max_items: 12 }
    # TLS 1.2 floor. NOTE this is a POLICY NAME allow-list, which is a proxy for a
    # cipher suite -- nothing here observes a negotiated connection.
    default:
      - ELBSecurityPolicy-TLS13-1-2-2021-06
      - ELBSecurityPolicy-TLS-1-2-Ext-2018-06

  # ===========================================================================
  # sc-13 — Cryptographic Protection
  # ===========================================================================

  approved_kms_key_arns:
    description: >-
      KMS key ARNs approved for default S3 bucket encryption. Empty means any CMK
      is accepted.
    control: sc-13
    oscal_param_id: sc-13_odp.02
    oscal_alt_id: sc-13_prm_2
    oscal_label: types of cryptography for each specified cryptographic use
    baselines: [low, moderate, high]
    type: list
    item_type: string
    constraint: { max_items: 30 }
    # Deliberately EMPTY. A key ARN is environment-specific and any value shipped
    # in a portable catalog would be somebody else's account. Unlike the IGW
    # allow-list this one fails OPEN when empty -- the managed rule accepts any
    # CMK -- so populate it if the control means specific keys.
    default: []

  # ===========================================================================
  # au-11 — Audit Record Retention
  # ===========================================================================

  audit_log_retention_days:
    description: >-
      Minimum retention period for CloudWatch log groups holding audit records.
    control: au-11
    oscal_param_id: au-11_odp
    oscal_alt_id: au-11_prm_1
    oscal_label: time period
    baselines: [low, moderate, high]
    type: integer
    # CloudWatch Logs accepts only a fixed set of retention values; the rule
    # compares against a minimum, so any value in range is legal to ASK for.
    constraint: { min: 1, max: 3653 }
    default: 365

  # ===========================================================================
  # si-4 — System Monitoring
  # ---------------------------------------------------------------------------
  # Three severities, one ODP. guardduty-non-archived-findings exposes
  # daysLowSev / daysMediumSev / daysHighSev separately, and they are genuinely
  # different thresholds for the same organizational decision.
  # ===========================================================================

  finding_age_low_days:
    description: >-
      Days a low-severity GuardDuty finding may remain unarchived before it is
      reported as non-compliant.
    control: si-4
    oscal_param_id: si-04_odp.06
    oscal_alt_id: si-4_prm_6
    oscal_label: frequency
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 365 }
    default: 30

  finding_age_medium_days:
    description: >-
      Days a medium-severity GuardDuty finding may remain unarchived.
    control: si-4
    oscal_param_id: si-04_odp.06
    oscal_alt_id: si-4_prm_6
    oscal_label: frequency
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 365 }
    default: 7

  finding_age_high_days:
    description: >-
      Days a high-severity GuardDuty finding may remain unarchived.
    control: si-4
    oscal_param_id: si-04_odp.06
    oscal_alt_id: si-4_prm_6
    oscal_label: frequency
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 365 }
    default: 1

  # ===========================================================================
  # cm-2 — Baseline Configuration
  # ===========================================================================

  approved_ami_tag_pairs:
    description: >-
      Tag key/value pairs identifying an AMI as approved for launch.
    control: cm-2
    oscal_param_id: cm-02_odp.02
    oscal_alt_id: cm-2_prm_2
    oscal_label: circumstances
    baselines: [low, moderate, high]
    type: list
    item_type: string
    # AWS takes this as ONE comma-separated string of `key` or `key:value` pairs.
    # A stray comma, a second colon, or surrounding whitespace does not error --
    # AWS ignores the malformed entry, so the allow-list is silently SMALLER than
    # it reads and more AMIs pass than intended. The pattern makes that a build
    # failure. Commas are forbidden inside an entry because they are the delimiter.
    constraint:
      max_items: 10
      item_pattern: '^[A-Za-z0-9+\-=._:/@]+(:[A-Za-z0-9+\-=._:/@ ]+)?$'
    # Deliberately empty and TAG-based rather than id-based. An AMI id list goes
    # stale on every image build, which turns the ODP into a maintenance treadmill
    # that quietly stops being updated -- and a stale allow-list fails closed on
    # every new image, so people widen it until it means nothing.
    default: []

  approved_ami_ids:
    description: >-
      AMI ids approved for launch, as the id-based alternative to the tag allow-list.
    control: cm-2
    oscal_param_id: cm-02_odp.02
    oscal_alt_id: cm-2_prm_2
    oscal_label: circumstances
    baselines: [low, moderate, high]
    type: list
    item_type: string
    constraint:
      max_items: 50
      # ami- followed by 8 or 17 hex characters. A malformed id does not error at
      # deploy time; it simply matches nothing, so the allow-list is silently
      # smaller than it reads and more AMIs pass than intended.
      item_pattern: '^ami-([0-9a-f]{8}|[0-9a-f]{17})$'
    default: []
    # ---------------------------------------------------------------------
    # THE FIRST ODP IN THIS CATALOG THAT CANNOT BE REGION-PORTABLE
    # ---------------------------------------------------------------------
    # An AMI id is scoped to ONE Region, and a private AMI to one account. The
    # same overlay deployed to a second Region therefore allow-lists nothing
    # there, and every instance fails -- not because it is unapproved, but
    # because the ids do not exist in that Region.
    #
    # Every other ODP here is a threshold or a policy name and travels
    # unchanged. This one does not, which breaks the one-overlay-many-Regions
    # model the rest of the design assumes.
    #
    # It also goes stale on every image build, so a maintained list drifts toward
    # being widened until it means nothing.
    #
    # PREFER approved_ami_tag_pairs. This exists because issue #6 names the rule
    # and omitting it silently would hide the choice; it defaults to empty, and
    # an empty list leaves the rule inert rather than half-configured.

  stopped_instance_allowed_days:
    description: >-
      Days an EC2 instance may remain stopped before it is reported.
    control: cm-2
    oscal_param_id: cm-02_odp.01
    oscal_alt_id: cm-2_prm_1
    oscal_label: frequency
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 365 }
    default: 30

  # ===========================================================================
  # cm-7 — Least Functionality
  # ===========================================================================

  approved_lambda_runtimes:
    description: >-
      Lambda runtimes permitted, as the least-functionality allow-list.
    control: cm-7
    oscal_param_id: cm-07_odp.01
    oscal_alt_id: cm-7_prm_1
    oscal_label: mission-essential capabilities
    baselines: [low, moderate, high]
    type: list
    item_type: string
    constraint: { max_items: 20 }
    # Empty means the rule does not constrain runtime. Populate with the runtimes
    # your organization supports; an out-of-date list is how an EOL runtime stays
    # in production while the pack reports compliant.
    default: []

  # ===========================================================================
  # si-2 — Flaw Remediation — EVIDENCE ONLY
  # ===========================================================================

  critical_patch_window_days:
    description: >-
      Days within which a critical flaw must be remediated after discovery.
    control: si-2
    oscal_param_id: si-02_odp
    oscal_alt_id: si-2_prm_1
    oscal_label: time period
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 365 }
    default: 30
    evidence_only: >-
      No AWS Config managed rule accepts a remediation window.
      ec2-managedinstance-patch-compliance-status-check reports SSM's own
      compliance verdict, which is computed against the SSM patch baseline's
      schedule and not against this value. Binding it to that rule would make an
      unenforced organizational deadline look like a control that passed. It is
      carried here so the value appears in evidence and is visibly not enforced.

  # ===========================================================================
  # cp-9 — System Backup
  # ===========================================================================

  backup_minimum_retention_days:
    description: >-
      Minimum retention required of a backup plan's recovery points.
    control: cp-9
    oscal_param_id: cp-09_odp.02
    oscal_alt_id: cp-9_prm_2
    oscal_label: frequency
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 35 }
    default: 35

  backup_minimum_frequency:
    description: >-
      Minimum frequency at which a backup plan must run.
    control: cp-9
    oscal_param_id: cp-09_odp.02
    oscal_alt_id: cp-9_prm_2
    oscal_label: frequency
    baselines: [low, moderate, high]
    # ONE ODP, TWO RULE PARAMETERS. backup-plan-min-frequency-and-min-retention-check
    # takes requiredFrequencyValue and requiredFrequencyUnit separately, and a
    # mismatched pair silently changes the meaning of the check by a factor of 24.
    # Modelling them as one duration and deriving both facets makes disagreement
    # structurally impossible rather than something a validator has to catch.
    type: duration
    constraint: { units: [hours, days], min: 1, max: 8760 }
    default: { value: 24, unit: hours }

  recovery_point_retention_days:
    description: >-
      Minimum retention required of an individual recovery point.
    control: cp-9
    oscal_param_id: cp-09_odp.03
    oscal_alt_id: cp-9_prm_3
    oscal_label: frequency
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 100 }
    default: 35

  # ===========================================================================
  # cp-10 — System Recovery and Reconstitution — EVIDENCE ONLY
  # ===========================================================================

  recovery_time_objective_hours:
    description: >-
      Maximum tolerable time to restore service after a disruption.
    control: cp-10
    oscal_param_id: cp-10_odp.01
    oscal_alt_id: cp-10_prm_1
    oscal_label: time period
    baselines: [low, moderate, high]
    type: integer
    constraint: { min: 1, max: 8760 }
    default: 24
    evidence_only: >-
      RTO has no configuration signal anywhere in AWS Config. Backup frequency is
      a weak proxy for RPO and says nothing at all about time-to-restore. Mapping
      a frequency rule to this would assert a recovery objective from a setting
      that cannot evidence it, so the value is carried in evidence and visibly
      not enforced. Restore-test evidence belongs to the runbook or CI producer.
