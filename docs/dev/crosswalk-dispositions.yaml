# Disposition of the 94 technical controls FedRAMP relates to KSIs our rules
# already serve, but which our crosswalks did not claim. Issue #26.
#
# THE QUESTION ASKED OF EACH ONE
# ------------------------------
# Not "is this control related to what the rule does" — FedRAMP's KSI mapping
# already says yes, and unioning it in would triple our reported coverage while
# making the traceability report worthless.
#
# The question is: **does a named rule evaluate a resource attribute that bears
# on what the control's STATEMENT requires?** Read from the statement, not the
# title.
#
# claim      — a rule evidences part of it. Almost always `supporting`: the rule
#              observes a precondition or an artifact, not the control's outcome.
# no-signal  — AWS Config cannot observe it. Records what could.
# gov        — a process or policy artifact. Routes to #8.

version: 1
reviewed: 2026-09-08
source: FedRAMP KSI->800-53 crosswalk, fedramp-consolidated-rules 2026.07.14.01

dispositions:

  # ===== ACCESS CONTROL ======================================================
  ac-17.1: { d: claim, rules: [cloud-trail-cloud-watch-logs-enabled, vpc-flow-logs-enabled], why: "Automated monitoring of remote access methods, to the extent those methods traverse recorded surfaces. Direct SSH and VPN sessions are not visible to either." }
  ac-17.2: { d: claim, rules: [s3-bucket-ssl-requests-only, redshift-require-tls-ssl, opensearch-https-required], why: "Cryptographic protection of sessions to managed services. NOT remote access in the AC-17 sense — VPN and SSH sessions are invisible to Config." }
  ac-17.3: { d: claim, rules: [internet-gateway-authorized-vpc-only, no-unrestricted-route-to-igw], why: "Routing through authorized network access control points is exactly what IGW authorization and route restriction evidence." }
