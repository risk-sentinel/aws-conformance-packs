  ac-12:   { d: no-signal, why: "Session termination timeout is not a resource attribute AWS Config observes." }
  ac-2.2:  { d: no-signal, why: "Temporary and emergency accounts are not distinguishable from any other IAM user. iam-user-unused-credentials-check is adjacent but measures inactivity, not account class." }
  ac-2.5:  { d: no-signal, why: "Inactivity logout is a session property, not a resource attribute." }
  ac-2.13: { d: no-signal, why: "Disabling within a period OF DISCOVERY is a timing property of a process; Config sees state, not elapsed time since an event it cannot see." }
  ac-6.2:  { d: no-signal, why: "Whether a user employs a non-privileged role for nonsecurity functions is a runtime behaviour, not configuration." }
  ac-6.10: { d: no-signal, why: "Preventing execution of privileged functions is an OS-level control." }
  ac-18.1: { d: no-signal, why: "No wireless surface exists in an AWS boundary." }
  ac-18.3: { d: no-signal, why: "As ac-18.1." }
  ac-14:   { d: gov, why: "A documented list of actions permitted without identification." }
  ac-20:   { d: gov, why: "Trust relationships and agreements with other organizations." }
