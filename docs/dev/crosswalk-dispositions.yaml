  ia-12:   { d: gov, why: "Identity proofing is a registration process." }
  ia-12.2: { d: gov, why: "As ia-12." }
  ia-12.3: { d: gov, why: "As ia-12." }
  ia-12.5: { d: gov, why: "As ia-12." }

  # ===== AUDIT ===============================================================
  au-3:    { d: claim, rules: [cloudtrail-enabled, cloudtrail-security-trail-enabled], why: "CloudTrail record content is fixed by AWS and does establish type/when/where/source/outcome. The rule evidences the trail, not the record schema." }
