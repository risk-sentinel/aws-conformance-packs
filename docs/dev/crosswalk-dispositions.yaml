  ac-2.4:  { d: claim, rules: [cloudtrail-enabled, multi-region-cloudtrail-enabled], why: "CloudTrail records IAM account create/modify/enable/disable/remove API calls. The rule evidences the trail exists, not that anyone reviews it." }
  ac-6.5:  { d: claim, rules: [iam-policy-no-statements-with-admin-access, iam-root-access-key-check], why: "Restricting privileged accounts. Customer-managed policies only — an attached AWS-managed AdministratorAccess is out of scope." }
