  ia-5.6:  { d: claim, rules: [secretsmanager-using-cmk, secretsmanager-secret-periodic-rotation, secretsmanager-secret-unused], why: "Protecting authenticators commensurate with sensitivity — Secrets Manager encryption and rotation is precisely this." }
