# Vanilla overlay for the HIGH baseline — PRISTINE REFERENCE.
#
# This file is regenerated when the catalog pattern changes, so edits here are
# lost. Copy it to `overlays/<your-org>.yaml`, change the values, and point the
# generator at your copy:
#
#     cp overlays/vanilla-high.yaml overlays/my-agency.yaml
#     python3 generate.py --overlay overlays/my-agency.yaml
#
# Same split as inputs.template.yml / inputs.yml elsewhere in this estate: the
# reference is ours and moves, your copy is yours and never gets overwritten.
#
# ---------------------------------------------------------------------------
# THESE VALUES ARE A TEACHING DEFAULT, NOT A RECOMMENDATION
# ---------------------------------------------------------------------------
# They are the awslabs "Operational Best Practices for NIST 800-53 Rev 5" values
# that risk-sentinel/sparc-iac already deploys. They are here because a reader
# recognises them on sight, so what has to be learned is the MECHANISM rather
# than the numbers.
#
# Your organization's values come from your tailoring, your SSP, and your
# authorizing official -- not from this file. Anything left unchanged is
# recorded in the traceability report as `assigned_by: vanilla-default`, so an
# untouched default is always visibly a default and is never mistaken for a
# decision somebody made.
#
# ---------------------------------------------------------------------------
# SHAPE
# ---------------------------------------------------------------------------
# `parameters[]` and `selections[]` mirror SPARC's baseline-parameters API
# (GET /api/v1/profile_documents/:slug/parameters), so a value written here can
# be pushed to that API and a tailored baseline exported from it can be read
# back here without a translation step.
#
# One difference, and it is deliberate: `param_id` here is the CATALOG's ODP
# key, not the raw OSCAL id. It has to be. Three of the entries below all
# satisfy the single OSCAL parameter ia-05.01_odp.02 ("composition and
# complexity rules"), and keying on the OSCAL id could not tell them apart.
# odp/catalog.yaml carries the join to `oscal_param_id` / `oscal_alt_id`.

baseline_level: high

parameters:

  # --- ac-2.3 -> ac-02.03_odp.02 (time period) ---
  - param_id: credential_inactivity_days
    value: 90
  - param_id: secret_unused_days
    value: 90

  # --- ac-4 -> ac-04_odp (information flow control policies) ---
  - param_id: authorized_igw_vpc_ids
    value: []

  # --- ac-6.1 -> ac-06.01_odp.05 (security-relevant information) ---
  - param_id: blocked_kms_action_patterns
    value:
    - kms:Decrypt
    - kms:ReEncryptFrom

  # --- au-11 -> au-11_odp (time period) ---
  - param_id: audit_log_retention_days
    value: 365

  # --- cm-2 -> cm-02_odp.01 (frequency) ---
  - param_id: stopped_instance_allowed_days
    value: 30

  # --- cm-2 -> cm-02_odp.02 (circumstances) ---
  - param_id: approved_ami_tag_pairs
    value: []

  # --- cm-7 -> cm-07_odp.01 (mission-essential capabilities) ---
  - param_id: approved_lambda_runtimes
    value: []

  # --- ia-5 -> ia-05_odp.01 (time period by authenticator type) ---
  - param_id: access_key_maximum_age_days
    value: 90
  - param_id: secret_rotation_period_days
    value: 90

  # --- ia-5.1 -> ia-05.01_odp.02 (composition and complexity rules) ---
  - param_id: password_maximum_age_days
    value: 90
  - param_id: password_minimum_length
    value: 14
  - param_id: password_reuse_prevention
    value: 24

  # --- sc-12 -> sc-12_odp (requirements) ---
  - param_id: certificate_expiry_warning_days
    value: 90
  - param_id: key_rotation_period_days
    value: 365

  # --- sc-13 -> sc-13_odp.02 (types of cryptography for each specified cryptographic use) ---
  - param_id: approved_kms_key_arns
    value: []

  # --- sc-7.4 -> sc-07.04_odp (frequency) ---
  - param_id: traffic_flow_policy_review_days
    value: 365

  # --- sc-7.5 -> sc-07.05_odp.02 (systems) ---
  - param_id: authorized_tcp_ports
    value:
    - 443
  - param_id: blocked_ingress_ports
    value:
    - 20
    - 21
    - 3389
    - 3306
    - 4333

  # --- sc-8.1 -> sc-08.01_odp (one-or-more) ---
  - param_id: approved_ssl_policies
    value:
    - ELBSecurityPolicy-TLS13-1-2-2021-06
    - ELBSecurityPolicy-TLS-1-2-Ext-2018-06

  # --- si-2 -> si-02_odp (time period) ---
  # EVIDENCE ONLY — no managed rule can enforce this. The value appears in
  # the evidence tags and in the coverage report, explicitly as unenforced.
  - param_id: critical_patch_window_days
    value: 30

  # --- si-4 -> si-04_odp.06 (frequency) ---
  - param_id: finding_age_high_days
    value: 1
  - param_id: finding_age_low_days
    value: 30
  - param_id: finding_age_medium_days
    value: 7

# No enumerated selections are in scope yet. The key is present so the file
# matches SPARC's response envelope, which always carries both collections.
selections: []
